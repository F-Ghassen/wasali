# 05_driver_route_cancel.yaml
# E2E flow: driver navigates to an active route that has at least one pending
# booking, cancels it, sees the cascade-impact copy in the confirmation
# dialog, confirms, and asserts the route no longer appears in the active
# routes list. Cancelling now cascades (migration 049) — every pending/
# confirmed booking on the route auto-rejects with reason='route_cancelled'
# instead of the cancel being blocked outright.
#
# Required env vars: DRIVER_EMAIL, DRIVER_PASSWORD
# Pre-condition: at least one active route with 1+ pending booking must exist
# for this driver (run seed-test-data.ts and 02_sender_search_and_book.yaml first).

appId: host.exp.Exponent

---

# 1. Launch
- launchApp:
    clearState: true

# 2. Sign in as driver
- tapOn:
    text: "Sign In"
- runFlow:
    file: .maestro/_login_driver.yaml

# 3. Open Routes tab
- tapOn:
    text: "Routes"
- assertVisible:
    text: "My Routes"

# 4. Tap the first active route to open its detail screen
- tapOn:
    text: "Berlin → Tunis"
    index: 0

# 5. Tap Cancel route (scroll down in case button is below the fold)
- scrollUntilVisible:
    element:
      text: "Cancel Route"
    direction: DOWN
- tapOn:
    text: "Cancel Route"

# 6. Confirm the alert shows the cascade-impact copy (not a "cannot cancel" block)
- assertVisible:
    text: "active booking"
- tapOn:
    text: "Cancel Route"

# 7. Assert we are back on the routes list and the route is gone from Active
- assertVisible:
    text: "My Routes"
- assertNotVisible:
    text: "Berlin → Tunis"
